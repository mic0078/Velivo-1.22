name: Instalator testowy (gałąź robocza rozwoj)

on:
  push:
    branches: ['rozwoj']
    paths: ['src/**', 'testy/**', '.github/workflows/instalator-rozwoj.yml']

permissions:
  contents: read

# nowsza wysylka anuluje starsza kompilacje (bez wyscigu przy zapisie instalatora)
concurrency:
  group: instalator-rozwoj-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # dwa zadania naraz: instalator do testu gotowy szybciej, testy (w tym bezpieczenstwa) ida rownolegle - link dopiero gdy oba zielone
  instalator:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: uBlock Origin Lite (najnowsze wydanie, GPL-3.0)
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod -Headers @{ 'User-Agent' = 'velivo-ci'; Authorization = "Bearer ${{ github.token }}" } https://api.github.com/repos/uBlockOrigin/uBOL-home/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -match 'chromium' -and $_.name -match '\.zip$' } | Select-Object -First 1
          if (-not $asset) { Write-Warning "Brak paczki uBOL dla Chromium - instalator bez uBOL"; exit 0 }
          Invoke-WebRequest $asset.browser_download_url -OutFile ubol.zip
          Remove-Item -Recurse -Force src\UbolExtension -ErrorAction SilentlyContinue
          Expand-Archive ubol.zip -DestinationPath ubol-tmp -Force
          $m = Get-ChildItem ubol-tmp -Recurse -Filter manifest.json | Select-Object -First 1
          Move-Item $m.Directory.FullName src\UbolExtension
          Write-Host "uBOL $($rel.tag_name) dolaczony"

      - name: Kompilacja programu
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build\velivo -ErrorAction SilentlyContinue
          dotnet publish src\Velivo.csproj -c Release -r win-x64 --self-contained true -o build\velivo

      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Budowa instalatora
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DPelny src\installer.iss
          Get-ChildItem Instalator

      # do testu wystarczy sam instalator - osobna, mala paczka (plik juz skompresowany, bez ponownego pakowania)
      - uses: actions/upload-artifact@v4
        with:
          name: Velivo-Setup-TEST-rozwoj
          path: Instalator/Velivo-Setup-*.exe
          compression-level: 0

  testy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: uBlock Origin Lite (najnowsze wydanie, GPL-3.0)
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod -Headers @{ 'User-Agent' = 'velivo-ci'; Authorization = "Bearer ${{ github.token }}" } https://api.github.com/repos/uBlockOrigin/uBOL-home/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -match 'chromium' -and $_.name -match '\.zip$' } | Select-Object -First 1
          if (-not $asset) { Write-Warning "Brak paczki uBOL dla Chromium - instalator bez uBOL"; exit 0 }
          Invoke-WebRequest $asset.browser_download_url -OutFile ubol.zip
          Remove-Item -Recurse -Force src\UbolExtension -ErrorAction SilentlyContinue
          Expand-Archive ubol.zip -DestinationPath ubol-tmp -Force
          $m = Get-ChildItem ubol-tmp -Recurse -Filter manifest.json | Select-Object -First 1
          Move-Item $m.Directory.FullName src\UbolExtension
          Write-Host "uBOL $($rel.tag_name) dolaczony"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testy w Chromium (tryb ciemny, czytanie)
        shell: pwsh
        run: |
          pip install --quiet reportlab
          npm install --no-save playwright@1.48.2
          npx playwright install chromium
          node testy/ciemny-tryb/test.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node testy/ciemny-tryb/test-wymuszony.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node testy/ciemny-tryb/test-wejscie.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node testy/ciemny-tryb/test-karta.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node testy/czytanie/test-glos.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node testy/czytanie/test-czytnik.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node testy/czytanie/test-tresc-sport.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node testy/czytanie/test-tytul-raz.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node testy/gesty/test-gesty.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node testy/lan-ustawienia/test-klucze.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node testy/tryb-bankowy/test-asystent.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node testy/tryb-bankowy/test-straznik.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node testy/tryb-bankowy/test-przelew.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node testy/tryb-bankowy/test-podpowiedz.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node testy/pamiec-stron/test-tresc.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node testy/odtwarzacz/test.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node testy/szybki-dostep/test.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node testy/pdf/test-tekst-pdf.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Kompilacja programu
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build\velivo -ErrorAction SilentlyContinue
          dotnet publish src\Velivo.csproj -c Release -r win-x64 --self-contained true -o build\velivo

      - name: Testy jednostkowe (prawdziwy kod Velivo)
        shell: pwsh
        run: dotnet test testy\Velivo.Tests\Velivo.Tests.csproj -c Release --filter "Category!=Vlc" --logger "console;verbosity=normal"

      - name: Test odtwarzacza filmow (libvlc pobrana i rozpakowana jak w instalatorze, odtwarza AVI)
        shell: pwsh
        run: |
          python -I testy/odtwarzacz-vlc/przygotuj.py "$env:RUNNER_TEMP\vlc"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:VELIVO_VLC_DIR = "$env:RUNNER_TEMP\vlc\build\x64"
          $env:VELIVO_VLC_AVI = "$env:RUNNER_TEMP\vlc\test.avi"
          dotnet test testy\Velivo.Tests\Velivo.Tests.csproj -c Release --filter "Category=Vlc" --logger "console;verbosity=normal"

      - name: Test LAN end-to-end (duzy stan, sparowany komputer)
        shell: pwsh
        run: ./testy/lan-duzy-stan/test.ps1 -Exe "$PWD\build\velivo\Velivo.exe"

      - name: Test LAN bezpieczenstwo (obcy pakiet nie zmienia danych, sparowany synchronizuje)
        shell: pwsh
        run: |
          New-Item -ItemType Directory wyniki -Force | Out-Null
          ./testy/bezpieczenstwo/lan-e2e.ps1 -Exe "build\velivo\Velivo.exe" -Mode unpaired -Out wyniki\lan-unpaired.json
          ./testy/bezpieczenstwo/lan-e2e.ps1 -Exe "build\velivo\Velivo.exe" -Mode paired -Out wyniki\lan-paired.json
          $u = Get-Content wyniki\lan-unpaired.json | ConvertFrom-Json; $p = Get-Content wyniki\lan-paired.json | ConvertFrom-Json
          $ok = $u.started -and $u.stillRunning -and -not $u.injectedBookmark -and -not $u.injectedSettings -and $p.injectedBookmark -and $p.injectedSettings
          Write-Host "obcy: zakladka=$($u.injectedBookmark) ustawienia=$($u.injectedSettings) | sparowany: zakladka=$($p.injectedBookmark) ustawienia=$($p.injectedSettings)"
          if (-not $ok) { exit 1 }
      # gałąź robocza: instalator tylko jako artefakt do testów, bez zapisu do repozytorium
