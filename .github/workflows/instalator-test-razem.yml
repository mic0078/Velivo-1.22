name: Instalator testowy (obie poprawki)

on:
  push:
    branches: ['test/obie-poprawki']

permissions:
  contents: read

# nowsza wysylka anuluje starsza kompilacje (bez wyscigu przy zapisie instalatora)
concurrency:
  group: instalator-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: uBlock Origin Lite (najnowsze wydanie, GPL-3.0)
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod -Headers @{ 'User-Agent' = 'velivo-ci'; Authorization = "Bearer ${{ github.token }}" } https://api.github.com/repos/uBlockOrigin/uBOL-home/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -match 'chromium' -and $_.name -match '\.zip$' } | Select-Object -First 1
          if (-not $asset) { Write-Warning "Brak paczki uBOL dla Chromium - instalator bez uBOL"; exit 0 }
          Invoke-WebRequest $asset.browser_download_url -OutFile ubol.zip
          Remove-Item -Recurse -Force src\UbolExtension -ErrorAction SilentlyContinue
          Expand-Archive ubol.zip -DestinationPath ubol-tmp -Force
          $m = Get-ChildItem ubol-tmp -Recurse -Filter manifest.json | Select-Object -First 1
          Move-Item $m.Directory.FullName src\UbolExtension
          Write-Host "uBOL $($rel.tag_name) dolaczony"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test trybu ciemnego (Chromium)
        shell: pwsh
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install chromium
          node testy/ciemny-tryb/test.mjs

      - name: Kompilacja programu
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build\velivo -ErrorAction SilentlyContinue
          dotnet publish src\Przegladarka.csproj -c Release -r win-x64 --self-contained true -o build\velivo

      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Budowa instalatora
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DPelny src\installer.iss
          Get-ChildItem Instalator

      - name: Samodzielny plik Velivo-1.22.exe (bez instalacji i bez .NET)
        shell: pwsh
        run: |
          dotnet publish src\Przegladarka.csproj -c Release -r win-x64 --self-contained true -o build\single `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true
          Copy-Item build\single\Velivo.exe Instalator\Velivo-1.22.exe -Force
          $mb = (Get-Item Instalator\Velivo-1.22.exe).Length / 1MB
          Write-Host ("Velivo-1.22.exe: {0:N1} MB" -f $mb)
          if ($mb -gt 95) { Write-Warning "Za duzy dla repozytorium - tylko w artefaktach"; Move-Item Instalator\Velivo-1.22.exe build\Velivo-1.22.exe -Force }

      - name: Wersja przenosna (skompilowany program bez instalatora)
        shell: pwsh
        run: |
          Remove-Item Instalator\Velivo-1.22-portable.zip -ErrorAction SilentlyContinue
          Compress-Archive -Path build\velivo\* -DestinationPath Instalator\Velivo-1.22-portable.zip -CompressionLevel Optimal
          Get-Item Instalator\Velivo-1.22-portable.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Velivo-Setup-TEST-obie-poprawki
          path: |
            Instalator/Velivo-Setup-*.exe
            Instalator/Velivo-1.22-portable.zip
            Instalator/Velivo-1.22.exe
            build/Velivo-1.22.exe
