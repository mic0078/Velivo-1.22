name: Instalator Velivo

on:
  push:
    branches: ['claude/**', 'main', 'master']
    paths: ['src/**', '.github/workflows/instalator.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: uBlock Origin Lite (najnowsze wydanie, GPL-3.0)
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod -Headers @{ 'User-Agent' = 'velivo-ci'; Authorization = "Bearer ${{ github.token }}" } https://api.github.com/repos/uBlockOrigin/uBOL-home/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -match 'chromium' -and $_.name -match '\.zip$' } | Select-Object -First 1
          if (-not $asset) { Write-Warning "Brak paczki uBOL dla Chromium - instalator bez uBOL"; exit 0 }
          Invoke-WebRequest $asset.browser_download_url -OutFile ubol.zip
          Remove-Item -Recurse -Force src\UbolExtension -ErrorAction SilentlyContinue
          Expand-Archive ubol.zip -DestinationPath ubol-tmp -Force
          $m = Get-ChildItem ubol-tmp -Recurse -Filter manifest.json | Select-Object -First 1
          Move-Item $m.Directory.FullName src\UbolExtension
          Write-Host "uBOL $($rel.tag_name) dolaczony"

      - name: Kompilacja programu
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build\velivo -ErrorAction SilentlyContinue
          dotnet publish src\Przegladarka.csproj -c Release -r win-x64 --self-contained false -o build\velivo

      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Budowa instalatora
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" src\installer.iss
          Get-ChildItem Instalator

      - uses: actions/upload-artifact@v4
        with:
          name: Velivo-Setup
          path: Instalator/Velivo-Setup-*.exe

      - name: Nadpisanie Instalator/Velivo-Setup-1.22.exe w repozytorium
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -f Instalator/Velivo-Setup-1.22.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Nowy instalator Velivo-Setup-1.22.exe [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          }
