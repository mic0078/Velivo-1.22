name: Instalator Velivo

on:
  push:
    branches: ['claude/**', 'main', 'master']
    paths: ['src/**', '.github/workflows/instalator.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Kompilacja programu
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build\velivo -ErrorAction SilentlyContinue
          dotnet publish src\Przegladarka.csproj -c Release -r win-x64 --self-contained false -o build\velivo

      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Budowa instalatora
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" src\installer.iss
          Get-ChildItem Instalator

      - uses: actions/upload-artifact@v4
        with:
          name: Velivo-Setup
          path: Instalator/Velivo-Setup-*.exe

      - name: Nadpisanie Instalator/Velivo-Setup-1.22.exe w repozytorium
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -f Instalator/Velivo-Setup-1.22.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Nowy instalator Velivo-Setup-1.22.exe [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          }
