name: Podpisane wydanie (prawdziwy certyfikat Code Signing)

# Uruchamiane RECZNIE, dopiero gdy w Settings -> Secrets and variables -> Actions sa ustawione:
#   CODESIGN_PFX_BASE64   - certyfikat Code Signing (OV/EV) z kluczem prywatnym, plik .pfx zakodowany base64
#   CODESIGN_PFX_PASSWORD - haslo do pliku .pfx
# Bez nich workflow konczy sie bledem - nigdy nie podpisuje certyfikatem testowym ani self-signed.
# Kolejnosc chroni podpis: Velivo.exe jest podpisywany PRZED spakowaniem do instalatora, instalator na koncu,
# a weryfikacja sprawdza takze Velivo.exe po cichej instalacji.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  podpis:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
      CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
      TIMESTAMP_URL: http://timestamp.digicert.com
    steps:
      - name: Wymagany prawdziwy certyfikat
        shell: pwsh
        run: |
          if (-not $env:CODESIGN_PFX_BASE64 -or -not $env:CODESIGN_PFX_PASSWORD) {
            Write-Host "::error::Brak sekretow CODESIGN_PFX_BASE64 / CODESIGN_PFX_PASSWORD - nie podpisuje (brak prawdziwego certyfikatu)."
            exit 1
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:CODESIGN_PFX_PASSWORD)
          $eku = $cert.Extensions | Where-Object { $_ -is [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] }
          $codeSigning = $eku -and ($eku.EnhancedKeyUsages | Where-Object { $_.Value -eq '1.3.6.1.5.5.7.3.3' })
          Write-Host "Subject: $($cert.Subject)"; Write-Host "Issuer: $($cert.Issuer)"; Write-Host "Thumbprint: $($cert.Thumbprint)"
          Write-Host "Waznosc: $($cert.NotBefore) - $($cert.NotAfter)"
          if (-not $codeSigning) { Write-Host "::error::Certyfikat nie ma przeznaczenia Code Signing (EKU 1.3.6.1.5.5.7.3.3)."; exit 1 }
          if ($cert.Subject -eq $cert.Issuer) { Write-Host "::error::Certyfikat self-signed - odrzucony."; exit 1 }
          if ($cert.NotAfter -lt (Get-Date)) { Write-Host "::error::Certyfikat wygasl."; exit 1 }
          if (-not $cert.Verify()) { Write-Host "::error::Lancuch certyfikatu nie jest zaufany w Windows."; exit 1 }
          "PFX=$pfx" | Out-File $env:GITHUB_ENV -Append

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: uBlock Origin Lite (jak w zwyklym buildzie)
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod -Headers @{ 'User-Agent' = 'velivo-ci'; Authorization = "Bearer ${{ github.token }}" } https://api.github.com/repos/uBlockOrigin/uBOL-home/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -match 'chromium' -and $_.name -match '\.zip$' } | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile ubol.zip
          if ($asset.digest -ne ('sha256:' + (Get-FileHash ubol.zip -Algorithm SHA256).Hash.ToLower())) { Write-Host "::error::uBOL: suma SHA-256 sie nie zgadza"; exit 1 }
          Expand-Archive ubol.zip -DestinationPath ubol-tmp -Force
          $m = Get-ChildItem ubol-tmp -Recurse -Filter manifest.json | Select-Object -First 1
          Move-Item $m.Directory.FullName src\UbolExtension

      - name: Kompilacja
        shell: pwsh
        run: |
          dotnet publish src\Przegladarka.csproj -c Release -r win-x64 --self-contained true -o build\velivo
          dotnet publish src\Przegladarka.csproj -c Release -r win-x64 --self-contained true -o build\single `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true

      - name: Podpis Velivo.exe (przed pakowaniem)
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          "SIGNTOOL=$signtool" | Out-File $env:GITHUB_ENV -Append
          foreach ($f in 'build\velivo\Velivo.exe', 'build\single\Velivo.exe') {
            & $signtool sign /f $env:PFX /p $env:CODESIGN_PFX_PASSWORD /fd sha256 /tr $env:TIMESTAMP_URL /td sha256 /d "Velivo" $f
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Instalator i podpis instalatora
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DPelny src\installer.iss
          Copy-Item build\single\Velivo.exe Instalator\Velivo-1.22.exe -Force
          & $env:SIGNTOOL sign /f $env:PFX /p $env:CODESIGN_PFX_PASSWORD /fd sha256 /tr $env:TIMESTAMP_URL /td sha256 /d "Velivo Setup 1.22" Instalator\Velivo-Setup-1.22.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item $env:PFX -Force

      - name: Weryfikacja podpisu (Authenticode, certyfikat, SHA-256, plik po instalacji)
        shell: pwsh
        run: |
          $ok = $true
          $dir = Join-Path $env:RUNNER_TEMP 'Velivo-instalacja'
          Start-Process Instalator\Velivo-Setup-1.22.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LANG=pl', "/DIR=$dir" -Wait
          foreach ($f in 'Instalator\Velivo-1.22.exe', 'Instalator\Velivo-Setup-1.22.exe', "$dir\Velivo.exe") {
            $s = Get-AuthenticodeSignature $f
            Write-Host "=== $f"
            Write-Host "SHA-256: $((Get-FileHash $f -Algorithm SHA256).Hash)"
            Write-Host "Status: $($s.Status) | Subject: $($s.SignerCertificate.Subject) | Issuer: $($s.SignerCertificate.Issuer) | Thumbprint: $($s.SignerCertificate.Thumbprint) | Waznosc: $($s.SignerCertificate.NotBefore) - $($s.SignerCertificate.NotAfter) | Znacznik czasu: $($s.TimeStamperCertificate.Subject)"
            & $env:SIGNTOOL verify /pa /v $f
            if ($s.Status -ne 'Valid' -or $LASTEXITCODE -ne 0) { $ok = $false }
          }
          if (-not $ok) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Velivo-1.22-podpisane
          path: |
            Instalator/Velivo-Setup-1.22.exe
            Instalator/Velivo-1.22.exe
