name: Test LAN duzy stan

on:
  push:
    branches: ['fix/lan-sync-udp-limit']

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Kompilacja Velivo
        shell: pwsh
        run: dotnet publish src\Przegladarka.csproj -c Release -r win-x64 --self-contained true -o build\velivo
      - name: Test
        shell: pwsh
        run: ./testy/lan-duzy-stan/test.ps1 -Exe "$PWD\build\velivo\Velivo.exe"
