name: Test PasswordVault 1430

on:
  push:
    branches: ['fix/passwordvault-1430']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kompilacja Velivo
        shell: pwsh
        run: dotnet publish src\Przegladarka.csproj -c Release -r win-x64 --self-contained true -o build\velivo
      - name: Test
        shell: pwsh
        run: ./testy/passwordvault/test.ps1 -Exe "$PWD\build\velivo\Velivo.exe"
