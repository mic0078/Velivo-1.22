<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>Pasek Monitora</title>
<style>body{background:#15181e;color:#e8ebf0;font:14px "Segoe UI",sans-serif;margin:0;padding:16px}
h2{font-size:14px;margin:14px 0 6px;color:#c5cfdd}.bar{background:#1c1c1c;height:40px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:4px;width:fit-content}
.t{font:12px Consolas,"Courier New",monospace;line-height:16px;white-space:pre;color:#fff;width:172px}.r{color:#f87171}.i{width:18px;height:18px;border-radius:4px;background:#22a34a}.v{width:18px;height:18px;border-radius:4px;background:linear-gradient(135deg,#6d28d9,#22b8d8)}</style></head><body>
<h2>Teraz (szeroko, emoji przesuwa górny wiersz)</h2>
<div class="bar"><div class="t" style="width:226px">🌐✕ ↑    0.04 KB/s  CPU: 2.14 GHz
↓    0.19 KB/s  CPU: 16 %</div><div class="i"></div><div class="v"></div></div>
<h2>Nowe – internet jest</h2>
<div class="bar"><div class="t">↑  5.05 KB/s CPU 4.36GHz
↓ 15.59 KB/s CPU     21%</div><div class="i"></div><div class="v"></div></div>
<h2>Nowe – bez internetu (tylko strzałki czerwone, nic się nie przesuwa)</h2>
<div class="bar"><div class="t"><span class="r">↑</span>  0.04 KB/s CPU 2.14GHz
<span class="r">↓</span>  0.19 KB/s CPU     16%</div><div class="i"></div><div class="v"></div></div>
</body></html>
