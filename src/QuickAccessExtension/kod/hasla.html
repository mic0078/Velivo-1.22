<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Szybki Dostep - Sejf</title>
  <style>
    body { width: 330px; margin: 0; padding: 16px; background: #1e2028; color: #f5f7fb; font: 14px Segoe UI, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 18px; }
    #domena { color: #9da6b8; margin-bottom: 12px; overflow-wrap: anywhere; }
    #status { min-height: 38px; margin-bottom: 10px; color: #cbd2df; }
    .blad { color: #ff9a8f; }
    select, input, button { width: 100%; box-sizing: border-box; padding: 9px; border: 0; border-radius: 3px; }
    select { margin-bottom: 8px; background: #2c303c; color: #fff; }
    input { margin-bottom: 8px; background: #2c303c; color: #fff; }
    button { background: #0878c9; color: #fff; cursor: pointer; }
    button:disabled { background: #4b5363; cursor: default; }
    hr { border: 0; border-top: 1px solid #3b4150; margin: 14px 0; }
    #dodajOpis { color: #9da6b8; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>Szybki Dostep - Sejf</h1>
  <div id="domena">Sprawdzam strone...</div>
  <div id="status">Szukam loginow.</div>
  <select id="wpisy" hidden></select>
  <button id="wypelnij" disabled>Wypelnij formularz</button>
  <hr>
  <div id="dodajOpis">Nie ma wpisu? Dodaj login do zaszyfrowanego sejfu.</div>
  <input id="nowyLogin" type="text" placeholder="Login lub e-mail">
  <input id="noweHaslo" type="password" placeholder="Haslo">
  <button id="dodajLogin">Dodaj login</button>
  <script src="jezyk-wybor.js"></script>
  <script src="jezyk.js"></script>
  <script src="hasla.js"></script>
</body>
</html>
