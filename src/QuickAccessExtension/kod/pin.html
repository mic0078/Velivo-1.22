<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>PIN profilu</title>
  <link rel="stylesheet" href="newtab.css">
  <style>
    /* Male okno na wierzchu - wlasny uklad, bez naglowka i siatki kafelkow. */
    body { padding: 22px 24px; min-width: 0; }
    h2 { margin: 0 0 6px; font-size: 17px; }
    p.opis { margin: 0 0 18px; font-size: 13px; color: var(--przygaszony); }
    input { width: 100%; margin: 6px 0 4px; }
    .blad { color: #e85c5c; font-size: 13px; min-height: 18px; margin: 0 0 12px; }
    .przyciski { display: flex; gap: 10px; justify-content: flex-end; }
  </style>
</head>
<body>
  <h2 id="tytul">Profil na PIN</h2>
  <p class="opis" id="opis">Podaj kod, zeby dodac strone do tego profilu.</p>
  <label>Kod
    <input id="pole" type="password" inputmode="numeric" autocomplete="off" autofocus>
  </label>
  <p class="blad" id="blad"></p>
  <div class="przyciski">
    <button id="anuluj" type="button" class="drugi">Anuluj</button>
    <button id="ok" type="button">Dodaj</button>
  </div>

  <script src="jezyk-wybor.js"></script>
  <script src="jezyk.js"></script>
  <script src="pin.js"></script>
</body>
</html>
