<!doctype html>
<!-- Rozmowa wideo Velivo (Windows i telefon): obraz i dźwięk WebRTC prosto między urządzeniami,
     zestawienie połączenia przez szyfrowany komunikator (velivo.send / chrome.webview.postMessage, odpowiedzi - onSig) -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#120f24;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
#you{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#120f24}
#me{position:fixed;right:12px;top:12px;width:28vw;max-width:220px;border-radius:12px;border:2px solid #7c4dff;transform:scaleX(-1);background:#000}
#st{position:fixed;left:0;right:0;top:40%;text-align:center;font-size:20px;text-shadow:0 1px 4px #000}
#bar{position:fixed;left:0;right:0;bottom:24px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:0 8px}#bar button{flex:0 0 auto}
@media (max-width:640px){#bar{gap:8px}#bar button{width:48px;height:48px;font-size:20px}}
button{width:60px;height:60px;border-radius:50%;border:0;font-size:24px;background:#3a2f6b;color:#fff}
button.off{background:#6b6b80}#end{background:#e53935}button.on{background:#22c55e}
#you.scr{object-fit:contain;background:#000}#you.steer,#shot.steer{touch-action:none;cursor:crosshair}
#scr,#help,#swap{display:none}button.pulse{outline:3px solid #facc15}
#shot{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none;z-index:1}#shot.pt{cursor:pointer}
#bar,#st,#me{z-index:3}
body.view #you,body.view #shot{height:calc(100% - 100px)}body.view #me{display:none}#dot{position:fixed;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid #e53935;background:#e5393566;display:none;z-index:2;pointer-events:none}
</style></head><body>
<video id="you" autoplay playsinline></video><img id="shot" alt=""><div id="dot"></div><video id="me" autoplay playsinline muted></video>
<div id="st"></div>
<div id="bar"><button id="mic">🎤</button><button id="cam">📷</button><button id="flip">🔄</button><button id="spk">🔊</button><button id="scr">🖥</button><button id="help">🖱</button><button id="swap">⇄</button><button id="end">⏹</button></div>
<script>
const q = new URLSearchParams(location.search), caller = q.get('rola') === 'dzwoni', pl = q.get('pl') !== '0', audio = q.get('audio') === '1';   // 📞 audio - rozmowa głosowa (bez kamery)
const T = (p, e) => pl ? p : e;
const you = document.getElementById('you'), me = document.getElementById('me'), st = document.getElementById('st');
function status(s) { st.textContent = s; }
function out(o) { const s = JSON.stringify(o); if (window.velivo) velivo.send(s); else if (window.chrome && chrome.webview) chrome.webview.postMessage(s); }
mic.title = T('Mikrofon wł./wył.', 'Microphone on/off'); cam.title = T('Kamera wł./wył.', 'Camera on/off');
flip.title = T('Przełącz kamerę', 'Switch camera'); scr.title = T('Pokaż swój ekran', 'Share your screen'); help.title = T('Pomoc zdalna: poproś o sterowanie', 'Remote help: ask for control'); spk.title = T('Głośnik / słuchawka', 'Speaker / earpiece'); swap.title = T('Zamień strony: teraz rozmówca pokazuje ekran (za zgodą)', 'Swap sides: now the other person shares the screen (with consent)'); end.title = T('Zakończ rozmowę', 'End call');
// poza domem - prywatny przekaźnik na domowym komputerze (TURN), bez serwerów firm trzecich; w domu - prosto w sieci domowej
let ice = []; try { ice = JSON.parse(q.get('ice') || '[]'); } catch (e) { }
let pc = null, local = null, facing = 'user', connected = false, done = false;
// 🖥 pomoc zdalna: ekran zamiast kamery; sterowanie myszą i klawiaturą tylko po zgodzie pokazującego (kanał danych WebRTC, prosto między urządzeniami)
let dc = null, sharing = null, mon = null, ctl = false, steer = false;
// 📱 ekran telefonu: klatki JPEG z Androida (velivo.screen), kawałkami po kanale danych; rozmówca wskazuje 👆 miejsce
let phoneScr = false, remoteImg = false, fid = 0, parts = null;
window.scrOn = () => {
  if (!dc || dc.readyState !== 'open') { velivo.screen(false); status(T('Brak kanału danych z rozmówcą – zaktualizuj Velivo u obu osób i zadzwoń jeszcze raz', 'No data channel with the other person – update Velivo on both devices and call again')); return; }
  phoneScr = true; scr.classList.add('on'); local.getVideoTracks().forEach(t => t.enabled = false); dsend({ k: 'scr', on: true, img: true, ctl: true });
  status(T('Pokazujesz ekran', 'Sharing your screen')); setTimeout(() => { if (phoneScr) status(''); }, 3000);
};
window.scrOff = () => { if (!phoneScr) return; ctlOff(); phoneScr = false; scr.classList.remove('on'); if (!cam.classList.contains('off')) local.getVideoTracks().forEach(t => t.enabled = true); dsend({ k: 'scr', on: false }); };
window.scrFrame = b => {
  if (!phoneScr || !dc || dc.readyState !== 'open' || dc.bufferedAmount > 512000) return;   // słabe łącze - klatka pominięta
  const id = ++fid, n = Math.ceil(b.length / 16000);
  for (let i = 0; i < n; i++) dsend({ k: 'f', id, i, n, d: b.slice(i * 16000, (i + 1) * 16000) });
};
function frame(o) {
  if (!remoteImg) return;
  if (!parts || parts.id !== o.id) parts = { id: o.id, got: 0, d: [] };
  if (parts.d[o.i] === undefined) { parts.d[o.i] = o.d; parts.got++; }
  if (parts.got === o.n) { if (!shot.src) status(''); shot.src = 'data:image/jpeg;base64,' + parts.d.join(''); parts = null; }
}
const host = o => { if (window.chrome && chrome.webview) chrome.webview.postMessage(JSON.stringify(o)); };   // tylko do własnego Velivo (Windows), nie do rozmówcy
function dsend(o) { if (dc && dc.readyState === 'open') dc.send(JSON.stringify(o)); }
function useDc(ch) {
  dc = ch;
  ch.onmessage = e => {
    let o; try { o = JSON.parse(e.data); } catch (x) { return; }
    if (o.k === 'in') { if (ctl && phoneScr) velivo.input(e.data); else if (ctl) host(o); }
    else if (o.k === 'scr') { you.classList.toggle('scr', o.on); help.style.display = o.on && (o.ctl || o.img) ? 'inline-block' : 'none'; if (!o.on) setSteer(false)
      document.body.classList.toggle('view', !!o.on);   // ekran rozmówcy nad paskiem przycisków, bez mojego podglądu
      remoteImg = o.on && !!o.img; shot.style.display = remoteImg ? 'block' : 'none'; status(remoteImg ? T('📱 Ekran rozmówcy – czekam na obraz…', '📱 Their screen – waiting for the picture…') : ''); shot.classList.toggle('pt', remoteImg); if (!remoteImg) shot.removeAttribute('src');
    }
    else if (o.k === 'f') frame(o);
    else if (o.k === 'pt') { if (phoneScr && window.velivo && velivo.point) velivo.point(o.x, o.y); }
    else if (o.k === 'ctl-ask') ask();
    else if (o.k === 'swap-ask') { ctlOff(); setSteer(false); } if (o.k === 'swap-ask') askUser(T('Rozmówca chce zamienić strony pomocy zdalnej (kto pokazuje ekran). Zgadzasz się?', 'The other person wants to swap remote-help sides (who shares the screen). Do you agree?'), 'swap');
    else if (o.k === 'swap-ok') doSwap();
    else if (o.k === 'swap-no') status(T('Nie zgodzono się na zamianę stron', 'Swapping sides was not allowed'));
    else if (o.k === 'ctl-ok') { setSteer(true); status(''); }
    else if (o.k === 'ctl-no') status(o.why === 'setup' ? T('Rozmówca musi raz włączyć „Velivo – pomoc zdalna” w Ułatwieniach dostępu – właśnie mu to pokazałem', 'The other person must turn on “Velivo – remote help” in Accessibility once – they were just shown how') : T('Nie zgodzono się na sterowanie', 'Control was not allowed'));
    else if (o.k === 'ctl-off') { ctlOff(); setSteer(false); }
  };
}
function setSteer(on) { steer = on; you.classList.toggle('steer', on); shot.classList.toggle('steer', on); help.classList.toggle('on', on); }
function ask() {
  if (phoneScr) {   // 📱 telefon: stuknięcia przez ułatwienia dostępu Velivo, pytanie także nad inną aplikacją
    if (!velivo.ctlReady()) { velivo.ctlSetup(); dsend({ k: 'ctl-no', why: 'setup' }); return; }
    askFor = 'ctl'; velivo.ask(T('Pozwolić rozmówcy stukać i przesuwać na Twoim telefonie?', 'Let the other person tap and swipe on your phone?')); return;
  }
  if (!sharing || !mon) { dsend({ k: 'ctl-no' }); return; }
  host({ k: 'ctl-ask' });   // pytanie w okienku Velivo nad wszystkimi oknami (okno rozmowy bywa schowane, gdy pokazujesz ekran)
}
// ⇄ zamiana stron w jednej rozmowie: pokazujący przestaje, drugi zaczyna pokazywać (Windows - jedno kliknięcie 🖥, przeglądarka wymaga kliknięcia)
let askFor = null;
function askUser(q, id) { if (window.chrome && chrome.webview) host({ k: 'ctl-ask', id, q }); else if (window.velivo && velivo.ask) { askFor = id; velivo.ask(q); } }
function swapYes(yes) { if (!yes) { dsend({ k: 'swap-no' }); return; } dsend({ k: 'swap-ok' }); doSwap(); }
function doSwap() {
  if (sharing || phoneScr) { if (phoneScr) velivo.screen(false); else stopShare(); status(T('Teraz rozmówca pokazuje swój ekran', 'Now the other person shares their screen')); return; }
  if (window.velivo && velivo.screen) velivo.screen(true);
  else { status(T('Kliknij 🖥, aby pokazać swój ekran', 'Click 🖥 to share your screen')); scr.classList.add('pulse'); }
}
swap.onclick = () => { if (steer) { setSteer(false); dsend({ k: 'ctl-off' }); } ctlOff(); dsend({ k: 'swap-ask' });   // zamiana zawsze kończy sterowanie
  status(T('Czekam na zgodę…', 'Waiting for permission…')); };
setInterval(() => { swap.style.display = connected && (sharing || phoneScr || document.body.classList.contains('view')) ? 'inline-block' : 'none'; }, 1000);
function ctlYes(yes) { if (!yes || !sharing || !mon) { dsend({ k: 'ctl-no' }); return; } ctl = true; host({ k: 'ctl-on', w: mon.w, h: mon.h }); dsend({ k: 'ctl-ok' }); }
window.ctlAnswer = yes => { const id = askFor; askFor = null; if (id === 'swap') { swapYes(yes); return; } if (!phoneScr) return; if (!yes) { dsend({ k: 'ctl-no' }); return; } ctl = true; velivo.ctl(true); dsend({ k: 'ctl-ok' }); status(T('🖱 Rozmówca steruje – zakończysz przyciskiem 🖥', '🖱 They are in control – stop with 🖥')); };
function ctlOff() { if (!ctl) return; ctl = false; host({ k: 'ctl-off' }); if (window.velivo && velivo.ctl) velivo.ctl(false); dsend({ k: 'ctl-off' }); }
const pend = [];
async function media() {
  if (audio) return await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  try { return await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
  catch (e) { return await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
}
async function start() {
  status(caller ? T('Dzwonię…', 'Calling…') : T('Łączę…', 'Connecting…'));
  // bez kamery i mikrofonu (np. komputer stacjonarny) - rozmowa tylko w odbiorze; ekran 🖥 nadal można pokazać
  try { local = await media(); } catch (e) { local = new MediaStream(); status(T('Bez kamery i mikrofonu – tylko odbiór (ekran możesz pokazać 🖥)', 'No camera or microphone – receive only (you can still share the screen 🖥)')); }
  me.srcObject = local;
  if (!local.getVideoTracks().length) { cam.classList.add('off'); flip.style.display = 'none'; }
  pc = new RTCPeerConnection({ iceServers: ice });
  local.getTracks().forEach(t => pc.addTrack(t, local));
  if (caller && !audio && !local.getVideoTracks().length) pc.addTransceiver('video', { direction: 'sendrecv', streams: [local] });   // miejsce na obraz ekranu
  if (caller && !local.getAudioTracks().length) pc.addTransceiver('audio', { direction: 'recvonly' });   // głos rozmówcy i tak słychać
  if (caller) useDc(pc.createDataChannel('pomoc')); else pc.ondatachannel = e => useDc(e.channel);
  if ((window.chrome && chrome.webview && navigator.mediaDevices.getDisplayMedia && !audio) || (window.velivo && velivo.screen && !audio)) scr.style.display = 'inline-block';
  // obraz bez strumienia (rozmówca bez kamery pokazuje ekran) - własny strumień, inaczej czarny ekran
  pc.ontrack = e => {
    let st = e.streams[0];
    if (!st) { st = you.srcObject instanceof MediaStream ? you.srcObject : new MediaStream(); st.getTracks().filter(t => t.kind === e.track.kind).forEach(t => st.removeTrack(t)); st.addTrack(e.track); }
    if (you.srcObject !== st) you.srcObject = st;
  };
  pc.onicecandidate = e => { if (e.candidate) out({ k: 'ice', c: e.candidate.toJSON() }); };
  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === 'connected') { connected = true; status(''); }
    else if (s === 'disconnected') status(T('Słabe połączenie…', 'Weak connection…'));
    else if (s === 'failed') { status(T('Nie udało się połączyć', 'Could not connect')); hang(); }
  };
  out(caller ? { k: 'ring', a: audio } : { k: 'accept' });
  if (caller) setTimeout(() => { if (!connected && !done && !pc.remoteDescription) { status(T('Nie odbiera', 'No answer')); hang(); } }, 45000);
}
function flush() { while (pend.length) pc.addIceCandidate(pend.shift()).catch(() => {}); }
window.onSig = async function (o) {
  if (typeof o === 'string') o = JSON.parse(o);
  if (done) return;
  try {
    if (o.k === 'accept' && caller && pc) { status(T('Łączę…', 'Connecting…')); const of = await pc.createOffer(); await pc.setLocalDescription(of); out({ k: 'offer', sdp: of.sdp }); }
    else if (o.k === 'offer' && pc) { await pc.setRemoteDescription({ type: 'offer', sdp: o.sdp }); flush();
      pc.getTransceivers().forEach(t => { if (t.receiver.track && t.receiver.track.kind === 'video' && !t.sender.track && t.direction === 'recvonly') { t.direction = 'sendrecv'; if (t.sender.setStreams) t.sender.setStreams(local); } });   // bez kamery - miejsce na obraz ekranu
      const an = await pc.createAnswer(); await pc.setLocalDescription(an); out({ k: 'answer', sdp: an.sdp }); }
    else if (o.k === 'answer' && pc) { await pc.setRemoteDescription({ type: 'answer', sdp: o.sdp }); flush(); }
    else if (o.k === 'ice') { if (pc && pc.remoteDescription) pc.addIceCandidate(o.c).catch(() => {}); else pend.push(o.c); }
    else if (o.k === 'reject' || o.k === 'busy') { status(o.k === 'busy' ? T('Rozmawia z kimś innym', 'Busy') : T('Odrzucono', 'Declined')); finish(); }
    else if (o.k === 'ctl-answer') { if (o.id === 'swap') swapYes(o.yes); else ctlYes(o.yes); }
    else if (o.k === 'ctl-stop') ctlOff();   // przycisk „Zakończ sterowanie” w Velivo
    else if (o.k === 'end') { status(T('Rozmowa zakończona', 'Call ended')); finish(); }
  } catch (e) { status(T('Błąd połączenia', 'Connection error')); hang(); }
};
if (window.chrome && chrome.webview) chrome.webview.addEventListener('message', e => onSig(e.data));
function finish() { if (done) return; ctlOff(); if (phoneScr) velivo.screen(false); done = true; if (local) local.getTracks().forEach(t => t.stop()); if (pc) pc.close(); setTimeout(() => out({ k: 'close' }), 1500); }
function hang() { if (done) return; out({ k: 'end' }); finish(); }
window.hang = hang;
end.onclick = () => { status(T('Rozmowa zakończona', 'Call ended')); hang(); };
mic.onclick = () => { if (!local) return; local.getAudioTracks().forEach(t => t.enabled = !t.enabled); mic.classList.toggle('off'); };
cam.onclick = () => { if (!local) return; local.getVideoTracks().forEach(t => t.enabled = !t.enabled); cam.classList.toggle('off'); me.style.visibility = cam.classList.contains('off') ? 'hidden' : 'visible'; };
flip.onclick = async () => {
  if (!local || !local.getVideoTracks().length) return;
  try {
    facing = facing === 'user' ? 'environment' : 'user';
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing } });
    const nt = s.getVideoTracks()[0], old = local.getVideoTracks()[0];
    const snd = pc && pc.getSenders().find(x => x.track && x.track.kind === 'video'); if (snd) await snd.replaceTrack(nt);
    local.removeTrack(old); old.stop(); local.addTrack(nt); me.srcObject = local;
    me.style.transform = facing === 'user' ? 'scaleX(-1)' : 'none';
  } catch (e) { flip.style.display = 'none'; }
};
scr.onclick = async () => {
  scr.classList.remove('pulse');
  if (window.velivo && velivo.screen) { velivo.screen(!phoneScr); return; }   // telefon: Android pyta o zgodę
  if (sharing) { stopShare(); return; }
  const tv = pc && pc.getTransceivers().find(t => t.receiver.track && t.receiver.track.kind === 'video'), snd = tv && tv.sender; if (!snd) return;
  try {
    const s = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: 'monitor' }, audio: false });
    const nt = s.getVideoTracks()[0]; await snd.replaceTrack(nt); sharing = nt;
    const g = nt.getSettings(); mon = g.displaySurface === 'monitor' || !g.displaySurface ? { w: g.width, h: g.height } : null;   // sterowanie tylko przy całym ekranie
    me.srcObject = s; me.style.transform = 'none'; scr.classList.add('on');
    dsend({ k: 'scr', on: true, ctl: !!mon }); nt.onended = stopShare;
    if (!mon) status(T('Pokazujesz okno – sterowanie działa tylko przy całym ekranie', 'Sharing a window – control works only with the entire screen'));
  } catch (e) { }
};
async function stopShare() {
  if (!sharing) return; const nt = sharing; sharing = null; mon = null; ctlOff(); nt.stop(); scr.classList.remove('on');
  const snd = pc && pc.getSenders().find(x => x.track === nt);
  const cam0 = local.getVideoTracks()[0]; if (snd) await snd.replaceTrack(cam0 || null).catch(() => {});
  me.srcObject = local; me.style.transform = facing === 'user' ? 'scaleX(-1)' : 'none'; dsend({ k: 'scr', on: false });
}
help.onclick = () => {
  if (steer) { setSteer(false); dsend({ k: 'ctl-off' }); } else { dsend({ k: 'ctl-ask' }); status(T('Czekam na zgodę…', 'Waiting for permission…')); } };
// miejsce na obrazie ekranu (bez czarnych pasów) jako ułamek 0..1
// clamp: ruch i puszczenie poza obrazem = na jego krawędzi (minimalizuj / zamknij są w samym rogu ekranu - inaczej przycisk zostawał wciśnięty)
function pos(e, el = you, clamp = false) {
  const r = el.getBoundingClientRect(), vw = el.videoWidth || el.naturalWidth, vh = el.videoHeight || el.naturalHeight; if (!vw || !vh) return null;
  const k = Math.min(r.width / vw, r.height / vh), w = vw * k, h = vh * k;
  const x = (e.clientX - r.left - (r.width - w) / 2) / w, y = (e.clientY - r.top - (r.height - h) / 2) / h;
  if (clamp) return { x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y)) };
  return x < 0 || y < 0 || x > 1 || y > 1 ? null : { x, y };
}
shot.addEventListener('click', e => {
  if (steer || !remoteImg) return; const p = pos(e, shot); if (!p) return;   // bez sterowania: kliknięcie = wskazówka 👆
  dsend({ k: 'pt', x: p.x, y: p.y }); dot.style.left = e.clientX + 'px'; dot.style.top = e.clientY + 'px'; dot.style.display = 'block';
  clearTimeout(dot.t); dot.t = setTimeout(() => dot.style.display = 'none', 1500);
});
let mv = null;
[you, shot].forEach(el => {
el.addEventListener('pointerdown', e => { if (!steer) return; const p = pos(e, el); if (!p) return; e.preventDefault(); el.setPointerCapture(e.pointerId); dsend({ k: 'in', t: 'd', b: e.button, x: p.x, y: p.y }); });
el.addEventListener('pointerup', e => { if (!steer) return; const p = pos(e, el, true); if (!p) return; e.preventDefault(); dsend({ k: 'in', t: 'u', b: e.button, x: p.x, y: p.y }); });
el.addEventListener('pointermove', e => { if (!steer) return; const p = pos(e, el, e.buttons > 0); if (!p) return; if (!mv) requestAnimationFrame(() => { if (mv) dsend({ k: 'in', t: 'm', x: mv.x, y: mv.y }); mv = null; }); mv = p; });
el.addEventListener('wheel', e => { if (!steer) return; e.preventDefault(); dsend({ k: 'in', t: 'w', d: e.deltaY > 0 ? -120 : 120 }); }, { passive: false });
el.addEventListener('contextmenu', e => { if (steer) e.preventDefault(); });
});
// okno rozmowy schowane / Alt+Tab / utracone przechwycenie - u rozmówcy nic nie zostaje wciśnięte
const rel = () => { if (steer) { mv = null; dsend({ k: 'in', t: 'rel' }); } };
window.addEventListener('blur', rel); document.addEventListener('visibilitychange', rel);
[you, shot].forEach(el => { el.addEventListener('pointercancel', rel); el.addEventListener('lostpointercapture', e => { if (e.buttons) rel(); }); });
['keydown', 'keyup'].forEach(n => document.addEventListener(n, e => { if (!steer) return; e.preventDefault(); dsend({ k: 'in', t: 'k', v: e.keyCode, up: n === 'keyup' }); }));
// telefon: głośnik albo słuchawka przy uchu (słuchawki przewodowe / Bluetooth - same)
if (window.velivo && velivo.speakerOn) { if (!velivo.speakerOn()) spk.classList.add('off'); spk.onclick = () => spk.classList.toggle('off', !velivo.speaker()); }
else spk.style.display = 'none';
start();
</script></body></html>
